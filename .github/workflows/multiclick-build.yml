name: Multi-click Windows build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiclick-build.yml'
      - 'src/flutter_ffi.rs'
      - 'scripts/apply_multiclick.py'
      - 'flutter/lib/desktop/pages/remote_page.dart'
      - 'flutter/lib/desktop/pages/remote_tab_page.dart'
      - 'src/flutter.rs'
      - 'flutter/lib/common/widgets/peer_card.dart'
      - 'flutter/lib/common/widgets/peer_tab_page.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-upstream:
    name: Import pinned RustDesk and apply multi-click
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import upstream into this repository (first run only)
        shell: bash
        env:
          UPSTREAM_SHA: 54416dcaa127d209f2cfbdc4b08235bae78ccfe6
        run: |
          set -euo pipefail
          if test -f src/flutter_ffi.rs; then
            echo "RustDesk source already exists; skipping import."
            test -f flutter/lib/desktop/pages/remote_page.dart
            grep -q MOUSE_BROADCAST_CONFIGS src/flutter_ffi.rs
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/rustdesk/rustdesk.git
          git fetch --depth 1 upstream "$UPSTREAM_SHA"
          # Import only the upstream file tree, not its shallow commit ancestry.
          # --overlay preserves this repository's scripts and custom workflow.
          git restore --source=FETCH_HEAD --staged --worktree --overlay -- .

          # Do not import the original project's many unrelated CI workflows.
          # Keep this repository's single opt-in Windows workflow.
          find .github/workflows -maxdepth 1 -type f ! -name 'multiclick-build.yml' -delete
          git add -A .github/workflows

          python3 scripts/apply_multiclick.py .
          git diff --check
          git add -A
          git commit -m "Import RustDesk $UPSTREAM_SHA and add opt-in multi-click"
          git push origin HEAD:main

  generate-bridge:
    name: Generate Flutter-Rust bridge
    needs: sync-upstream
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout imported RustDesk source
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75'
          components: rustfmt

      - name: Install Flutter for code generation
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.3'

      - name: Cache Rust codegen dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: frb-codegen

      - name: Install flutter-rust-bridge codegen tools
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Generate Rust and Dart bridge
        shell: bash
        run: |
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload generated bridge files
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-flutter-bridge
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64 ZIP
    needs: [sync-upstream, generate-bridge]
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      VCPKG_ROOT: 'C:\vcpkg'
      VCPKG_BINARY_SOURCES: clear
      VCPKG_DEFAULT_TRIPLET: x64-windows-static

    steps:
      - name: Checkout imported RustDesk source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          submodules: recursive

      - name: Download generated Flutter-Rust bridge
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-flutter-bridge
          path: .

      - name: Verify patch is in imported sources
        shell: pwsh
        run: |
          if (!(Test-Path src/flutter_ffi.rs)) { throw "Upstream source not imported" }
          if (!(Select-String -Path src/flutter_ffi.rs -Pattern 'MOUSE_BROADCAST_CONFIGS' -Quiet)) {
            throw "Multi-click patch not applied"
          }
          $fixedPredicate = 'let regular_move = m.get("type").map_or(true, |t| t.is_empty())'
          foreach ($path in @('src/flutter_ffi.rs', 'scripts/apply_multiclick.py')) {
            if (!( (Get-Content -Raw -LiteralPath $path).Contains($fixedPredicate) )) {
              throw "Missing empty-type mouse movement fix in $path"
            }
          }
          if (!(Select-String -Path flutter/lib/consts.dart -Pattern 'const String kMouseEventTypeDefault = "";' -SimpleMatch -Quiet)) {
            throw "Expected Flutter's empty mouse movement type was not found"
          }
          foreach ($path in @('src/flutter_ffi.rs', 'scripts/apply_multiclick.py')) {
            if (!( (Get-Content -Raw -LiteralPath $path).Contains('MOUSE_BROADCAST_CONFIGS') )) {
              throw "Missing selected-target routing in $path"
            }
          }
          $pickerSource = Get-Content -Raw -LiteralPath 'flutter/lib/desktop/pages/remote_page.dart'
          if (!( $pickerSource.Contains("const Text('멀티클릭')") -and
                  $pickerSource.Contains('입력을 받을 원격 기기를 선택하세요.') -and
                  $pickerSource.Contains('selected.addAll(connected)') )) {
            throw "Missing current compact multi-click target selection dialog"
          }
          if (!( (Get-Content -Raw -LiteralPath 'src/flutter_ffi.rs').Contains('mouse_broadcast_map_axis') )) {
            throw "Missing proportional coordinate transform"
          }
          if (!( (Get-Content -Raw -LiteralPath 'flutter/lib/desktop/pages/remote_tab_page.dart').Contains('_MouseBroadcastTitleButton') )) {
            throw "Missing titlebar multi-click button"
          }
          if (!( (Get-Content -Raw -LiteralPath 'flutter/lib/desktop/pages/remote_tab_page.dart').Contains('remote.stopMouseBroadcast()') )) {
            throw "Missing one-click OFF behavior"
          }
          $picker = Get-Content -Raw -LiteralPath 'flutter/lib/desktop/pages/remote_page.dart'
          foreach ($check in @('PointerDeviceKind.mouse', 'mainGetPeerOptionSync', 'scrollController', '입력을 받을 원격 기기를 선택하세요.')) {
            if (!($picker.Contains($check))) {
              throw "Missing improved multi-click picker functionality: $check"
            }
          }
          $core = Get-Content -Raw -LiteralPath 'src/flutter_ffi.rs'
          if (!($core.Contains('mouse-broadcast-targets:') -and
                  $core.Contains('mouse-broadcast-connected-peers') -and
                  $core.Contains('peer_id == source_peer_id'))) {
            throw "Missing independent multi-source routing or self-exclusion"
          }
          if (!( (Get-Content -Raw -LiteralPath 'flutter/lib/common/widgets/peer_card.dart').Contains('connectedRemotePeerIds') )) {
            throw "Missing connected badges on main screen"
          }
          if (!( (Get-Content -Raw -LiteralPath 'flutter/lib/common/widgets/peer_tab_page.dart').Contains('_syncConnectedPeers') )) {
            throw "Missing main screen connected-status polling"
          }
          if (!($picker.Contains('AlwaysScrollableScrollPhysics') -and
                  $picker.Contains('const Divider(height: 14, thickness: 1)'))) {
            throw "Missing scrollable fixed-height picker and bottom divider"
          }
          Write-Host "Verified per-window broadcasting, self-exclusion, list scrolling, and connected badges."

      - name: Install LLVM 15
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '15.0.6'

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          architecture: x64

      - name: Prepare RustDesk custom Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source -Parent) -Parent
          Write-Host "Flutter root: $flutterRoot"
          Invoke-WebRequest -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" -OutFile "windows-x64-release.zip"
          Expand-Archive -Path "windows-x64-release.zip" -DestinationPath "engine-unpacked"
          Copy-Item -Path "engine-unpacked\*" -Destination "$flutterRoot\bin\cache\artifacts\engine\windows-x64-release\" -Recurse -Force
          Copy-Item ".github\patches\flutter_3.24.4_dropdown_menu_enableFilter.diff" "$flutterRoot\dropdown.patch"
          Push-Location $flutterRoot
          git apply dropdown.patch
          Pop-Location

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75'
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: 'C:\vcpkg'
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
          doNotCache: true

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          # RustDesk's native crates (including magnum-opus) resolve
          # VCPKG_ROOT/installed/<triplet>, not vcpkg's manifest default
          # <repo>/vcpkg_installed/<triplet>.
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Verify native dependencies are in expected directory
        shell: pwsh
        run: |
          $root = Join-Path $env:VCPKG_ROOT "installed\x64-windows-static"
          $header = Join-Path $root "include\opus\opus_multistream.h"
          $library = Join-Path $root "lib\opus.lib"
          Write-Host "VCPKG_ROOT: $env:VCPKG_ROOT"
          Write-Host "Checking Opus header: $header"
          if (!(Test-Path -LiteralPath $header)) {
            throw "Opus header was not installed in the location expected by magnum-opus: $header"
          }
          if (!(Test-Path -LiteralPath $library)) {
            throw "Opus library was not installed in the location expected by magnum-opus: $library"
          }
          Write-Host "Opus static library and headers verified."

      - name: Build RustDesk Windows Flutter application
        shell: pwsh
        run: |
          # No --hwcodec: avoid the FFmpeg headers required by optional hardware encoding.
          # Multi-click only needs the default software codec stack.
          python .\build.py --portable --flutter --skip-portable-pack

      - name: Check compiled program
        shell: pwsh
        run: |
          if (!(Test-Path "flutter\build\windows\x64\runner\Release\rustdesk.exe")) {
            throw "RustDesk executable not found"
          }

      - name: Upload complete Windows build folder
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-multiclick-windows-x64
          path: flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    name: Publish patched Windows preview release
    needs: [build-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: v1.5.3-multiclick-preview.6
      ASSET_NAME: RustDesk-MultiClick-Windows-x64.zip

    steps:
      - name: Download successful Windows build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name rustdesk-multiclick-windows-x64 --dir payload
          exe="$(find payload -type f -iname rustdesk.exe -print -quit)"
          if [ -z "$exe" ]; then
            echo "::error::rustdesk.exe not found in successful Windows build artifact"
            exit 1
          fi
          echo "Validated executable: $exe"

      - name: Package full application and SHA256
        shell: bash
        run: |
          set -euo pipefail
          (cd payload && zip -q -r "../$ASSET_NAME" .)
          sha256sum "$ASSET_NAME" > SHA256SUMS.txt
          test -s "$ASSET_NAME"

      - name: Prepare preview release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## RustDesk MultiClick Windows x64 — preview 6

          **Independent multi-click sources**
          - Each remote window keeps its own target checkbox list and ON/OFF state.
          - Multiple windows can be ON simultaneously (e.g., 1 and 3).
          - A window can never select or broadcast back to its own remote device.
          - Clicking its red ON mouse icon turns only that window OFF.
            Reopening restores that window's previously selected devices.

          **Improved picker**
          - A bounded-height list displays a scrollbar when there are many devices.
          - Scroll with mouse wheel, drag the scrollbar or press-and-drag.
          - A separator line appears below the device list.
          - Device aliases remain preferred over their numeric RustDesk IDs.

          **Home device list**
          - Connected remote peers are marked "접속 중" separately from the
            existing online/reachable indicator, in grid and tile/list views.
          - Connection badges refresh about once per second.

          **Retained:** Compact titlebar mouse button and proportional
          coordinate mapping for different screen resolutions.

          Windows x64 unofficial unsigned preview based on RustDesk 1.5.3.
          No hardware-codec feature, keyboard/wheel/relative/touch rebroadcast.
          Live multi-device testing is still required beyond CI compilation.

          Extract the entire ZIP into a separate folder and run rustdesk.exe.
          Do not replace the official RustDesk installation.
          EOF

      - name: Upload new preview release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists; keeping existing release unchanged."
            exit 1
          fi
          gh release create "$TAG_NAME" "$ASSET_NAME" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RustDesk MultiClick Windows x64 — Preview 6 (independent multi-sources & connected badges)" \
            --notes-file RELEASE_NOTES.md \
            --prerelease

      - name: Verify published assets
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq "$ASSET_NAME" <<< "$assets"
          grep -Fxq SHA256SUMS.txt <<< "$assets"
